    <text x="58" y="70" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#d45f50">PIGMEMORY · 原理图 07/12</text><text x="58" y="126" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#3e3635">并行召回：候选层级与六种检索通道</text><text x="60" y="166" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#786b67"><tspan x="60" dy="0">一次 query 同时访问多个对象表与通道；同一对象被多个通道命中会合并为一个候选并保留每个 channel rank。</tspan></text><line x1="58" y1="204" x2="1542" y2="204" stroke="#eadbd4" stroke-width="2"/>
    <g><rect x="55" y="245" width="300" height="250" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><text x="79" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">Tier 1 · Skill</text><text x="79" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">对象：candidate / active </tspan><tspan x="79" dy="28">Skill</tspan><tspan x="79" dy="28">过滤：η 下限、状态、owner</tspan><tspan x="79" dy="28"> scope</tspan><tspan x="79" dy="28">正文：summary / trigger /</tspan><tspan x="79" dy="28"> invocation guide</tspan><tspan x="79" dy="28">完整指南默认不直接塞入</tspan><tspan x="79" dy="28">提示 Agent 按需调用兼容工</tspan><tspan x="79" dy="28">具取全文</tspan></text></g><g><rect x="385" y="245" width="405" height="250" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><text x="409" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">Tier 2 · 经验层</text><text x="409" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="409" dy="0">2a Trace：单个决策点，带 V / priorit</tspan><tspan x="409" dy="28">y</tspan><tspan x="409" dy="28">2b Episode：同任务 Trace 聚合摘要</tspan><tspan x="409" dy="28">2c Experience：反馈型 Policy，带 sal</tspan><tspan x="409" dy="28">ience/confidence/gain</tspan><tspan x="409" dy="28">普通 Trace 默认不取低价值</tspan><tspan x="409" dy="28">repair 可包含负 V / priority=0</tspan></text></g><g><rect x="820" y="245" width="300" height="250" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><text x="844" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">Tier 3 · World Model</text><text x="844" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="844" dy="0">对象：active WorldModel</tspan><tspan x="844" dy="28">过滤：confidence 下限、ow</tspan><tspan x="844" dy="28">ner scope</tspan><tspan x="844" dy="28">正文：环境事实、推断、约</tspan><tspan x="844" dy="28">束</tspan><tspan x="844" dy="28">带 source policyIds</tspan><tspan x="844" dy="28">回答“环境通常怎样运作”</tspan></text></g><g><rect x="1150" y="245" width="395" height="250" rx="22" fill="#f5f6f7" stroke="#a8b0b6" stroke-width="2"/><text x="1174" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#4e5961">候选统一结构</text><text x="1174" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1174" dy="0">refId / refKind / tier / ts</tspan><tspan x="1174" dy="28">cosine / vec</tspan><tspan x="1174" dy="28">channels[] = {channel, rank, score}</tspan><tspan x="1174" dy="28">对象特有质量字段</tspan><tspan x="1174" dy="28">debug：为什么命中、哪个字段命中</tspan><tspan x="1174" dy="28">后续排序不再回查原始表</tspan></text></g><g><rect x="36" y="565" width="1528" height="1" fill="#e98b79" opacity="0.5"/><rect x="38" y="544" width="160" height="42" rx="21" fill="#d86554"/><text x="118" y="572" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">六种 Channel</text></g><g><rect x="55" y="615" width="225" height="250" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><text x="79" y="657" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">vec_summary</text><text x="79" y="693" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">query 向量 ↔ Trace</tspan><tspan x="79" dy="28"> 摘要向量</tspan><tspan x="79" dy="28">代表语义主题相似</tspan><tspan x="79" dy="28">分数：clamp(cosine</tspan><tspan x="79" dy="28">,0,1)</tspan></text></g><g><rect x="305" y="615" width="225" height="250" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><text x="329" y="657" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">vec_action</text><text x="329" y="693" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="329" dy="0">query 向量 ↔ 动作/</tspan><tspan x="329" dy="28">工具向量</tspan><tspan x="329" dy="28">适合找相似操作</tspan><tspan x="329" dy="28">Trace 可同时命中两</tspan><tspan x="329" dy="28">个向量列</tspan></text></g><g><rect x="555" y="615" width="225" height="250" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><text x="579" y="657" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">vec</text><text x="579" y="693" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="579" dy="0">Skill / Policy / W</tspan><tspan x="579" dy="28">orldModel 的主向量</tspan><tspan x="579" dy="28">跨对象语义召回</tspan><tspan x="579" dy="28">向量缺失进入补嵌入</tspan><tspan x="579" dy="28">队列</tspan></text></g><g><rect x="805" y="615" width="225" height="250" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><text x="829" y="657" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">fts</text><text x="829" y="693" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="829" dy="0">SQLite FTS5 关键词</tspan><tspan x="829" dy="28">检索</tspan><tspan x="829" dy="28">基础分：0.65/(rank</tspan><tspan x="829" dy="28">+1)</tspan><tspan x="829" dy="28">向量服务失败时仍可</tspan><tspan x="829" dy="28">用</tspan></text></g><g><rect x="1055" y="615" width="225" height="250" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><text x="1079" y="657" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">pattern</text><text x="1079" y="693" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1079" dy="0">短中文、代码词、混</tspan><tspan x="1079" dy="28">合词覆盖</tspan><tspan x="1079" dy="28">按覆盖率计分</tspan><tspan x="1079" dy="28">分数上限 0.60</tspan></text></g><g><rect x="1305" y="615" width="240" height="250" rx="22" fill="#fff0f1" stroke="#df7078" stroke-width="2"/><text x="1329" y="657" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9e303b">structural</text><text x="1329" y="693" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1329" dy="0">错误签名精确/结构匹</tspan><tspan x="1329" dy="28">配</tspan><tspan x="1329" dy="28">如 errorCode + tool</tspan><tspan x="1329" dy="28">强信号基准约 0.9</tspan><tspan x="1329" dy="28">主要服务故障修复</tspan></text></g><g><path d="M 185 865 Q 447.5 957.5 710 930" fill="none" stroke="#339475" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/><rect x="373.5" y="911.5" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="447.5" y="933.5" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1c725a">同一 refId 合并 channel ranks</text></g><g><path d="M 1425 865 Q 1157.5 957.5 890 930" fill="none" stroke="#ca4c57" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/><rect x="1083.5" y="911.5" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1157.5" y="933.5" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9e303b">不重复制造候选</text></g>
