<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
    <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf9"/><stop offset="0.55" stop-color="#fff9f3"/><stop offset="1" stop-color="#eef8f4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5e4037" flood-opacity="0.10"/></filter>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d86554"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#339475"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4c88c5"/></marker><marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b98b25"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8064bb"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77838c"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ca4c57"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#619b49"/></marker>
  </defs>
    <rect width="1600" height="1100" fill="url(#bg)"/>
    <text x="58" y="70" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#d45f50">PIGMEMORY · 原理图 01/12</text><text x="58" y="126" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#3e3635">总览：一次对话怎样变成下一次可用的记忆</text><text x="60" y="166" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#786b67"><tspan x="60" dy="0">先看完整闭环；后面 11 张图逐段放大。</tspan></text><line x1="58" y1="204" x2="1542" y2="204" stroke="#eadbd4" stroke-width="2"/>
    <g><rect x="55" y="245" width="285" height="250" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><circle cx="85" cy="277" r="20" fill="#d86554"/><text x="85" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">1</text><text x="113" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">实时回合</text><text x="79" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">用户消息进入</tspan><tspan x="79" dy="28">→ 判断主题关系</tspan><tspan x="79" dy="28">→ 检索旧记忆</tspan><tspan x="79" dy="28">→ 安全注入上下文</tspan><tspan x="79" dy="28">→ Agent 回复/调用工具</tspan></text></g><g><rect x="410" y="245" width="285" height="250" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><circle cx="440" cy="277" r="20" fill="#4c88c5"/><text x="440" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">2</text><text x="468" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">L1 即时落盘</text><text x="434" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="434" dy="0">每回合拆成决策点</tspan><tspan x="434" dy="28">工具调用各是一条 Trace</tspan><tspan x="434" dy="28">最终回答另是一条 Trace</tspan><tspan x="434" dy="28">先写 summary + 向量</tspan><tspan x="434" dy="28">reflection=null，α=0</tspan></text></g><g><rect x="765" y="245" width="355" height="250" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><circle cx="795" cy="277" r="20" fill="#b98b25"/><text x="795" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">3</text><text x="823" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">主题结束后评分</text><text x="789" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="789" dy="0">批量反思并判断可用性 α</tspan><tspan x="789" dy="28">等待反馈窗口（默认 30 秒）</tspan><tspan x="789" dy="28">计算 R_human</tspan><tspan x="789" dy="28">从末步向前回传 V</tspan><tspan x="789" dy="28">按时间衰减得到 priority</tspan></text></g><g><rect x="1190" y="245" width="355" height="250" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><circle cx="1220" cy="277" r="20" fill="#8064bb"/><text x="1220" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">4</text><text x="1248" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">跨任务演化</text><text x="1214" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1214" dy="0">L2：Trace → Policy</tspan><tspan x="1214" dy="28">L3：Policy 簇 → World Model</tspan><tspan x="1214" dy="28">Skill：高质量 Policy → 可调用技</tspan><tspan x="1214" dy="28">能</tspan><tspan x="1214" dy="28">反馈失败 → 修复经验</tspan><tspan x="1214" dy="28">所有对象都保留证据链</tspan></text></g><g><path d="M 340 370 L 410 370" fill="none" stroke="#d86554" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-coral)"/><rect x="301" y="354" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="375" y="376" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9b3f31">回合结束</text></g><g><path d="M 695 370 L 765 370" fill="none" stroke="#4c88c5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="656" y="354" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="730" y="376" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#285f91">主题边界</text></g><g><path d="M 1120 370 L 1190 370" fill="none" stroke="#b98b25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/><rect x="1081" y="354" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1155" y="376" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#80611b">reward.updated</text></g><g><rect x="36" y="565" width="1528" height="1" fill="#66b79b" opacity="0.5"/><rect x="38" y="544" width="160" height="42" rx="21" fill="#339475"/><text x="118" y="572" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">下一回合</text></g><g><rect x="145" y="625" width="355" height="235" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><text x="169" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">并行召回</text><text x="169" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="169" dy="0">Tier 1：Skill</tspan><tspan x="169" dy="28">Tier 2：Trace / Episode / Exper</tspan><tspan x="169" dy="28">ience</tspan><tspan x="169" dy="28">Tier 3：World Model</tspan><tspan x="169" dy="28">向量、FTS、模式、结构错误通道并</tspan><tspan x="169" dy="28">行</tspan></text></g><g><rect x="625" y="625" width="355" height="235" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><text x="649" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">融合与精排</text><text x="649" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="649" dy="0">最佳通道分 + RRF</tspan><tspan x="649" dy="28">+ priority / η / confidence</tspan><tspan x="649" dy="28">相对阈值 + 多通道豁免</tspan><tspan x="649" dy="28">MMR 去冗余</tspan><tspan x="649" dy="28">LLM 相关性过滤（失败时放行机械</tspan><tspan x="649" dy="28">排序）</tspan></text></g><g><rect x="1105" y="625" width="355" height="235" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><text x="1129" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">安全注入</text><text x="1129" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1129" dy="0">按 Skills / Memories / Experien</tspan><tspan x="1129" dy="28">ces / Environment 分组</tspan><tspan x="1129" dy="28">只给技能摘要，按需再取完整指南</tspan><tspan x="1129" dy="28">包在 &lt;relevant-memories&gt;</tspan><tspan x="1129" dy="28">明确标记为不可信历史数据</tspan><tspan x="1129" dy="28">交给 Agent 本回合使用</tspan></text></g><g><path d="M 500 742 L 625 742" fill="none" stroke="#339475" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/><rect x="488.5" y="726" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="562.5" y="748" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1c725a">候选集</text></g><g><path d="M 980 742 L 1105 742" fill="none" stroke="#4c88c5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="968.5" y="726" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1042.5" y="748" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#285f91">最终片段</text></g><g><path d="M 1280 860 Q 767.5 985 255 870" fill="none" stroke="#d86554" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-coral)"/><rect x="693.5" y="909" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="767.5" y="931" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9b3f31">新产生的结果再次进入 L1</text></g><g><rect x="330" y="935" width="940" height="90" rx="16" fill="#fff8df" stroke="#d8b45f" stroke-width="2" stroke-dasharray="7 6"/><text x="350" y="966" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#80611b"><tspan x="350" dy="0">关键时钟：回合结束只做轻量捕获；主题结束才做反思、奖励、L2/L3/Skill。</tspan><tspan x="350" dy="26">所以刚写入的 Trace 可以马上被检索，但其 α / V 要等主题闭环后才可靠。</tspan></text></g>
    <text x="1540" y="1070" text-anchor="end" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#9a8c87">依据当前源码执行链绘制 · 2026-08-07</text>
  </svg>