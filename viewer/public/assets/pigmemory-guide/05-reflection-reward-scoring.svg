  </defs>
    <rect width="1600" height="1100" fill="url(#bg)"/>
    <text x="58" y="70" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#d45f50">PIGMEMORY · 原理图 05/12</text><text x="58" y="126" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#3e3635">Trace 如何打分：α、R_human、V 与 priority 的完整链</text><text x="60" y="166" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#786b67"><tspan x="60" dy="0">α 判断“这条反思是否能解释决策”；R_human 判断“整项任务做得怎样”；V 把任务结果分配回每个步骤。</tspan></text><line x1="58" y1="204" x2="1542" y2="204" stroke="#eadbd4" stroke-width="2"/>
    <g><rect x="55" y="245" width="340" height="265" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><circle cx="85" cy="277" r="20" fill="#8064bb"/><text x="85" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">1</text><text x="113" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">反思质量 α_t</text><text x="79" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">Judge 输入：任务上下文、state</tspan><tspan x="79" dy="28">、thinking、action、tool outco</tspan><tspan x="79" dy="28">me、后续步骤、reflection</tspan><tspan x="79" dy="28">输出 alpha∈[0,1] + usable</tspan><tspan x="79" dy="28">usable=false → α=0</tspan><tspan x="79" dy="28">反思为空/解析失败 → α=0</tspan></text></g><g><rect x="455" y="245" width="355" height="265" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><circle cx="485" cy="277" r="20" fill="#d86554"/><text x="485" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">2</text><text x="513" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">任务奖励 R_human</text><text x="479" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="479" dy="0">反馈窗口内有显式反馈：立即评分</tspan><tspan x="479" dy="28">否则 30 秒后用已存隐式信号</tspan><tspan x="479" dy="28">LLM 失败：回退极性启发式</tspan><tspan x="479" dy="28">无反馈的启发式结果为 0</tspan></text></g><g><rect x="870" y="245" width="675" height="265" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><circle cx="900" cy="277" r="20" fill="#b98b25"/><text x="900" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">3</text><text x="928" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">三轴合成公式</text><text x="894" y="323" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, Noto Sans Mono CJK SC, monospace" font-size="19" font-weight="450" fill="#45515a"><tspan x="894" dy="0">goal, process, satisfaction ∈ [-1, 1]</tspan><tspan x="894" dy="29">R_human = clamp(</tspan><tspan x="894" dy="29">  0.45 × goalAchievement</tspan><tspan x="894" dy="29">+ 0.30 × processQuality</tspan><tspan x="894" dy="29">+ 0.25 × userSatisfaction, -1, 1)</tspan><tspan x="894" dy="29">显式启发式：只从 feedback polarity 得 satisfaction</tspan></text></g><g><path d="M 395 378 L 455 378" fill="none" stroke="#8064bb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-purple)"/><rect x="351" y="362" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="425" y="384" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#624196">任务级反馈</text></g><g><path d="M 810 378 L 870 378" fill="none" stroke="#d86554" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-coral)"/><rect x="766" y="362" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="840" y="384" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9b3f31">三轴</text></g><g><rect x="36" y="580" width="1528" height="1" fill="#73a7d9" opacity="0.5"/><rect x="38" y="559" width="160" height="42" rx="21" fill="#4c88c5"/><text x="118" y="587" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">从最后一步向前回传</text></g><g><rect x="55" y="625" width="510" height="270" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><text x="79" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">价值回传</text><text x="79" y="703" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, Noto Sans Mono CJK SC, monospace" font-size="20" font-weight="450" fill="#45515a"><tspan x="79" dy="0">边界：V_T = R_human</tspan><tspan x="79" dy="31">递推：V_t = α_t × R_human</tspan><tspan x="79" dy="31">           + (1 − α_t) × γ × V_(t+1)</tspan><tspan x="79" dy="31">当前默认 γ = 0.9</tspan><tspan x="79" dy="31">α=0：完全依赖后续结果折扣传播</tspan><tspan x="79" dy="31">α=1：该步直接承接整项任务奖励</tspan></text></g><g><rect x="625" y="625" width="410" height="270" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><text x="649" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">检索优先级</text><text x="649" y="703" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, Noto Sans Mono CJK SC, monospace" font-size="20" font-weight="450" fill="#45515a"><tspan x="649" dy="0">decay = 0.5 ^ (Δdays / halfLifeDa</tspan><tspan x="649" dy="31">ys)</tspan><tspan x="649" dy="31">priority_t = max(V_t, 0) × decay</tspan><tspan x="649" dy="31">默认 halfLifeDays = 30</tspan><tspan x="649" dy="31">负 V 仍永久保存</tspan><tspan x="649" dy="31">但 priority=0；普通检索下沉</tspan><tspan x="649" dy="31">Decision Repair 可显式召回负样本</tspan></text></g><g><rect x="1095" y="625" width="450" height="270" rx="22" fill="#eef8e9" stroke="#83b86b" stroke-width="2"/><text x="1119" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#40732e">四步示例</text><text x="1119" y="703" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, Noto Sans Mono CJK SC, monospace" font-size="18" font-weight="450" fill="#45515a"><tspan x="1119" dy="0">设 R=0.8，γ=0.9，α=[0,0.6,0.2,0]</tspan><tspan x="1119" dy="28">V4 = 0.800</tspan><tspan x="1119" dy="28">V3 = 0.2×0.8 + 0.8×0.9×0.8 = 0.736</tspan><tspan x="1119" dy="28">V2 = 0.6×0.8 + 0.4×0.9×0.736 = 0.745</tspan><tspan x="1119" dy="28">V1 = 0×0.8 + 1×0.9×0.745 = 0.670</tspan><tspan x="1119" dy="28">当天 priority≈V；30 天后约减半</tspan></text></g><g><rect x="300" y="960" width="1000" height="59" rx="16" fill="#fff0f1" stroke="#df7078" stroke-width="2" stroke-dasharray="7 6"/><text x="320" y="991" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#9e303b"><tspan x="320" dy="0">Reward 前有确定性“无意义任务”门：轮次、内容长度、无用户消息、纯测试/寒暄、工具结果占比过高、重复内容。命中</tspan><tspan x="320" dy="26">后不发 reward.updated，避免污染 L2/L3/Skill。</tspan></text></g>
    <text x="1540" y="1070" text-anchor="end" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#9a8c87">依据当前源码执行链绘制 · 2026-08-07</text>
  </svg>