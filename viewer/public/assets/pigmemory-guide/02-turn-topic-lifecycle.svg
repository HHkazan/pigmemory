<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
    <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf9"/><stop offset="0.55" stop-color="#fff9f3"/><stop offset="1" stop-color="#eef8f4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5e4037" flood-opacity="0.10"/></filter>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d86554"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#339475"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4c88c5"/></marker><marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b98b25"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8064bb"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77838c"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ca4c57"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#619b49"/></marker>
  </defs>
    <rect width="1600" height="1100" fill="url(#bg)"/>
    <text x="58" y="70" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#d45f50">PIGMEMORY · 原理图 02/12</text><text x="58" y="126" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#3e3635">回合与主题边界：什么时候只记录，什么时候开始进化</text><text x="60" y="166" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#786b67"><tspan x="60" dy="0">Session 是会话容器；Episode 是同一主题的任务片段；Turn 是一次用户—助手交互。</tspan></text><line x1="58" y1="204" x2="1542" y2="204" stroke="#eadbd4" stroke-width="2"/>
    <g><rect x="36" y="255" width="1528" height="1" fill="#e98b79" opacity="0.5"/><rect x="38" y="234" width="160" height="42" rx="21" fill="#d86554"/><text x="118" y="262" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">Turn Start</text></g><g><rect x="65" y="295" width="285" height="215" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><circle cx="95" cy="327" r="20" fill="#d86554"/><text x="95" y="334" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">1</text><text x="123" y="337" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">接收用户消息</text><text x="89" y="373" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="89" dy="0">沿用 sessionId</tspan><tspan x="89" dy="28">读取当前 open episode</tspan><tspan x="89" dy="28">若没有则创建新 Episode</tspan></text></g><g><rect x="410" y="295" width="350" height="215" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><circle cx="440" cy="327" r="20" fill="#b98b25"/><text x="440" y="334" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">2</text><text x="468" y="337" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">关系分类</text><text x="434" y="373" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="434" dy="0">输入：上一主题首尾文本 + 新消息</tspan><tspan x="434" dy="28"> + gapMs</tspan><tspan x="434" dy="28">输出：revision / follow_up / un</tspan><tspan x="434" dy="28">known / new_task</tspan><tspan x="434" dy="28">超时则用保守默认</tspan></text></g><g><rect x="820" y="295" width="320" height="215" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><circle cx="850" cy="327" r="20" fill="#8064bb"/><text x="850" y="334" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">3</text><text x="878" y="337" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">决定边界</text><text x="844" y="373" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="844" dy="0">同题且未超窗口：追加</tspan><tspan x="844" dy="28">新任务/超时/达到回合上限：</tspan><tspan x="844" dy="28">先 finalize 旧 Episode</tspan><tspan x="844" dy="28">再创建新 Episode</tspan></text></g><g><rect x="1200" y="295" width="335" height="215" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><circle cx="1230" cy="327" r="20" fill="#339475"/><text x="1230" y="334" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">4</text><text x="1258" y="337" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">检索并注入</text><text x="1224" y="373" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1224" dy="0">意图调度决定 Tier</tspan><tspan x="1224" dy="28">执行 turn_start 检索</tspan><tspan x="1224" dy="28">返回 InjectionPacket</tspan><tspan x="1224" dy="28">适配器交给 Agent</tspan></text></g><g><path d="M 350 402 L 410 402" fill="none" stroke="#d86554" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-coral)"/><rect x="306" y="386" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="380" y="408" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9b3f31">有上下文</text></g><g><path d="M 760 402 L 820 402" fill="none" stroke="#b98b25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/><rect x="716" y="386" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="790" y="408" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#80611b">relation</text></g><g><path d="M 1140 402 L 1200 402" fill="none" stroke="#8064bb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-purple)"/><rect x="1096" y="386" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1170" y="408" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#624196">当前 Episode</text></g><g><rect x="36" y="575" width="1528" height="1" fill="#73a7d9" opacity="0.5"/><rect x="38" y="554" width="160" height="42" rx="21" fill="#4c88c5"/><text x="118" y="582" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">Turn End</text></g><g><rect x="65" y="620" width="350" height="230" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><circle cx="95" cy="652" r="20" fill="#4c88c5"/><text x="95" y="659" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">5</text><text x="123" y="662" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">记录本回合结果</text><text x="89" y="698" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="89" dy="0">追加 assistant 与 tool turns</tspan><tspan x="89" dy="28">保留 tool input/output/error/ti</tspan><tspan x="89" dy="28">ming</tspan><tspan x="89" dy="28">完整 Episode 快照仍在内存/存储</tspan><tspan x="89" dy="28">中</tspan></text></g><g><rect x="485" y="620" width="350" height="230" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><circle cx="515" cy="652" r="20" fill="#339475"/><text x="515" y="659" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">6</text><text x="543" y="662" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">runLite 即时捕获</text><text x="509" y="698" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="509" dy="0">只提取本回合新增步骤</tspan><tspan x="509" dy="28">摘要 + 向量 + 去重 + 写 Trace</tspan><tspan x="509" dy="28">不做反思，不触发 reward</tspan><tspan x="509" dy="28">页面立即可见</tspan></text></g><g><rect x="905" y="620" width="310" height="230" rx="22" fill="#eef8e9" stroke="#83b86b" stroke-width="2"/><circle cx="935" cy="652" r="20" fill="#619b49"/><text x="935" y="659" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">7A</text><text x="963" y="662" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#40732e">主题继续</text><text x="929" y="698" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="929" dy="0">Episode 保持 open</tspan><tspan x="929" dy="28">下一回合继续追加</tspan><tspan x="929" dy="28">不启动完整演化链</tspan></text></g><g><rect x="1270" y="620" width="265" height="230" rx="22" fill="#fff0f1" stroke="#df7078" stroke-width="2"/><circle cx="1300" cy="652" r="20" fill="#ca4c57"/><text x="1300" y="659" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">7B</text><text x="1328" y="662" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9e303b">主题结束</text><text x="1294" y="698" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1294" dy="0">episode.finalized</tspan><tspan x="1294" dy="28">→ runReflect</tspan><tspan x="1294" dy="28">→ Reward</tspan><tspan x="1294" dy="28">→ L2 / L3 / Skill</tspan></text></g><g><path d="M 415 735 L 485 735" fill="none" stroke="#4c88c5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="376" y="719" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="450" y="741" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#285f91">本回合快照</text></g><g><path d="M 835 735 L 905 735" fill="none" stroke="#619b49" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="796" y="719" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="870" y="741" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#40732e">同一主题</text></g><g><path d="M 1215 735 L 1270 735" fill="none" stroke="#ca4c57" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/><rect x="1168.5" y="719" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1242.5" y="741" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9e303b">边界事件</text></g><g><rect x="300" y="915" width="1000" height="90" rx="16" fill="#fff8df" stroke="#d8b45f" stroke-width="2" stroke-dasharray="7 6"/><text x="320" y="946" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#80611b"><tspan x="320" dy="0">主题边界不是“每次回复结束”。它通常在下一条用户消息被判定为 new_task、间隔过长、达到回合上限或会话关闭时发</tspan><tspan x="320" dy="26">生。</tspan><tspan x="320" dy="26">这解释了为什么有些 Trace 已经出现，但反思、V、Policy、Skill 仍稍后才补齐。</tspan></text></g>
    <text x="1540" y="1070" text-anchor="end" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#9a8c87">依据当前源码执行链绘制 · 2026-08-07</text>
  </svg>