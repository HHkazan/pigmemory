<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
    <defs><linearGradient id="formula-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf9"/><stop offset="1" stop-color="#f4fbf8"/></linearGradient><filter id="formula-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#6d4a40" flood-opacity="0.10"/></filter></defs>
    <rect width="1200" height="430" rx="28" fill="url(#formula-bg)"/>
    <rect x="34" y="34" width="8" height="76" rx="4" fill="#619b49"/>
    <text x="66" y="65" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#619b49">PIGMEMORY · 核心公式图解</text>
    <text x="66" y="104" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="900" fill="#433735">Policy Gain：基础估算 + 实际送达修正</text>
    <text x="1160" y="67" text-anchor="end" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#887872">不取消原算法；真实送达越多，实际结果影响越大</text>
    
      <g filter="url(#formula-shadow)"><rect x="42" y="142" width="535" height="238" rx="22" fill="#eef8e9" stroke="#83b86b" stroke-width="2"/><rect x="607" y="142" width="551" height="238" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/></g>
      <text x="72" y="183" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#40732e">① 基础 Gain 保留原算法</text>
      <text x="310" y="231" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Noto Sans Math, serif" font-size="27" fill="#35452f">G<tspan baseline-shift="sub" font-size="17">base</tspan> = EMA(V<tspan baseline-shift="sub" font-size="17">linked</tspan><tspan baseline-shift="super" font-size="16">*</tspan> − B)</text>
      <text x="310" y="278" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Noto Sans Math, serif" font-size="22" fill="#35452f">B = shrink(V̄<tspan baseline-shift="sub" font-size="15">other</tspan>, baseline, N<tspan baseline-shift="sub" font-size="15">0</tspan>=5)</text>
      <text x="310" y="330" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#5d6d57">关联任务维持快速估算 · 基础值继续做 α=0.4 的 EMA</text>
      <text x="637" y="183" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#80611b">② 实际送达从第 2 次开始修正</text>
      <text x="882" y="218" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Noto Sans Math, serif" font-size="20" fill="#5d4820">G<tspan baseline-shift="sub" font-size="14">actual</tspan> = effective(V<tspan baseline-shift="sub" font-size="14">delivered</tspan>) − B<tspan baseline-shift="sub" font-size="14">actual</tspan></text>
      <text x="882" y="251" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Noto Sans Math, serif" font-size="20" fill="#5d4820">n&lt;2: G<tspan baseline-shift="sub" font-size="14">final</tspan> = G<tspan baseline-shift="sub" font-size="14">base</tspan></text>
      <text x="882" y="283" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Noto Sans Math, serif" font-size="20" fill="#5d4820">w = min(0.9, (n−1)/(n+0.5))</text>
      <text x="882" y="318" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Noto Sans Math, serif" font-size="20" fill="#5d4820">G<tspan baseline-shift="sub" font-size="14">final</tspan> = (1−w)G<tspan baseline-shift="sub" font-size="14">base</tspan> + wG<tspan baseline-shift="sub" font-size="14">actual</tspan></text>
      <text x="882" y="352" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#735e2f">n=2 → 40% · n=3 → 57% · 最高 90%</text>
  </svg>