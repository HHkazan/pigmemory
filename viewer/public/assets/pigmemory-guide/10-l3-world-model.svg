    <text x="58" y="70" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#d45f50">PIGMEMORY · 原理图 10/12</text><text x="58" y="126" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#3e3635">L3 World Model：从策略簇提炼环境认知</text><text x="60" y="166" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#786b67"><tspan x="60" dy="0">L3 回答“这个环境通常如何运作、可以怎样推断、有哪些约束”，并保存 Policy 与 Episode 证据来源。</tspan></text><line x1="58" y1="204" x2="1542" y2="204" stroke="#eadbd4" stroke-width="2"/>
    <g><rect x="55" y="245" width="275" height="260" rx="22" fill="#eef8e9" stroke="#83b86b" stroke-width="2"/><circle cx="85" cy="277" r="20" fill="#619b49"/><text x="85" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">1</text><text x="113" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#40732e">筛选 Policy</text><text x="79" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">status=active</tspan><tspan x="79" dy="28">gain ≥ minPolicyGain</tspan><tspan x="79" dy="28">support ≥ minPolicySupp</tspan><tspan x="79" dy="28">ort</tspan><tspan x="79" dy="28">可按 domainTags 限定</tspan><tspan x="79" dy="28">先对旧 WorldModel 做生</tspan><tspan x="79" dy="28">命周期对账</tspan></text></g><g><rect x="370" y="245" width="285" height="260" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><circle cx="400" cy="277" r="20" fill="#4c88c5"/><text x="400" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">2</text><text x="428" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">分域与聚类</text><text x="394" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="394" dy="0">按 domain key 分桶</tspan><tspan x="394" dy="28">计算策略向量质心</tspan><tspan x="394" dy="28">优先保留 cosine≥阈值的 s</tspan><tspan x="394" dy="28">trict cohort</tspan><tspan x="394" dy="28">若不足但整桶达到最小数量</tspan><tspan x="394" dy="28">，则 loose admission</tspan><tspan x="394" dy="28">计算 cohesion 与 avgGain</tspan></text></g><g><rect x="695" y="245" width="285" height="260" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><circle cx="725" cy="277" r="20" fill="#b98b25"/><text x="725" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">3</text><text x="753" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">幂等与冷却</text><text x="719" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="719" dy="0">cluster fingerprint 已处</tspan><tspan x="719" dy="28">理 → 跳过重复</tspan><tspan x="719" dy="28">同域近期抽象过 → cooldow</tspan><tspan x="719" dy="28">n</tspan><tspan x="719" dy="28">无 centroid → 跳过</tspan><tspan x="719" dy="28">按 avgGain×cohesion 排序</tspan><tspan x="719" dy="28">每个簇加载 Policy 对应 T</tspan><tspan x="719" dy="28">race 证据</tspan></text></g><g><rect x="1020" y="245" width="250" height="260" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><circle cx="1050" cy="277" r="20" fill="#8064bb"/><text x="1050" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">4</text><text x="1078" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">LLM 抽象</text><text x="1044" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1044" dy="0">输入结构化 Policy + </tspan><tspan x="1044" dy="28">L1 证据</tspan><tspan x="1044" dy="28">输出 title / body</tspan><tspan x="1044" dy="28">environment 条目</tspan><tspan x="1044" dy="28">inference 规则</tspan><tspan x="1044" dy="28">constraints 约束</tspan><tspan x="1044" dy="28">domain tags</tspan></text></g><g><rect x="1310" y="245" width="235" height="260" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><circle cx="1340" cy="277" r="20" fill="#d86554"/><text x="1340" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">5</text><text x="1368" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">合并或新建</text><text x="1334" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="450" fill="#45515a"><tspan x="1334" dy="0">显式 supersedes 优先</tspan><tspan x="1334" dy="26">其次 Policy overlap≥</tspan><tspan x="1334" dy="26">0.6</tspan><tspan x="1334" dy="26">再比较向量 cosine</tspan><tspan x="1334" dy="26">命中则 update，否则 </tspan><tspan x="1334" dy="26">create</tspan><tspan x="1334" dy="26">保存 fingerprint</tspan></text></g><g><path d="M 330 375 L 370 375" fill="none" stroke="#619b49" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="276" y="359" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="350" y="381" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#40732e">eligible</text></g><g><path d="M 655 375 L 695 375" fill="none" stroke="#4c88c5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="601" y="359" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="675" y="381" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#285f91">cluster</text></g><g><path d="M 980 375 L 1020 375" fill="none" stroke="#b98b25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/><rect x="926" y="359" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1000" y="381" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#80611b">evidence</text></g><g><path d="M 1270 375 L 1310 375" fill="none" stroke="#8064bb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-purple)"/><rect x="1216" y="359" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1290" y="381" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#624196">draft</text></g><g><rect x="36" y="575" width="1528" height="1" fill="#66b79b" opacity="0.5"/><rect x="38" y="554" width="160" height="42" rx="21" fill="#339475"/><text x="118" y="582" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">WorldModel 内容与生命周期</text></g><g><rect x="55" y="625" width="360" height="290" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><text x="79" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">结构化正文</text><text x="79" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">Environment：可观察事实/拓扑</tspan><tspan x="79" dy="28">Inference：从事实到结论的规则</tspan><tspan x="79" dy="28">Constraints：边界、限制、失败条</tspan><tspan x="79" dy="28">件</tspan><tspan x="79" dy="28">body：便于注入的总述</tspan><tspan x="79" dy="28">title / domainTags：检索入口</tspan></text></g><g><rect x="455" y="625" width="350" height="290" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><text x="479" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">证据与版本</text><text x="479" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="479" dy="0">policyIds：由哪些 L2 策略支撑</tspan><tspan x="479" dy="28">sourceEpisodeIds：追溯到任务</tspan><tspan x="479" dy="28">clusterFingerprint：同一证据簇</tspan><tspan x="479" dy="28">幂等</tspan><tspan x="479" dy="28">更新时合并旧/新唯一条目</tspan><tspan x="479" dy="28">向量为空则排队补嵌入</tspan></text></g><g><rect x="845" y="625" width="330" height="290" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><text x="869" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">置信度</text><text x="869" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="869" dy="0">由簇质量、策略 gain、cohesion</tspan><tspan x="869" dy="28"> 等塑形</tspan><tspan x="869" dy="28">loose cluster 会降低可信程度</tspan><tspan x="869" dy="28">后续更新可按 confidenceDelta </tspan><tspan x="869" dy="28">漂移</tspan><tspan x="869" dy="28">低于 minConfidenceForRetrieva</tspan><tspan x="869" dy="28">l 不进入 Tier 3</tspan></text></g><g><rect x="1215" y="625" width="330" height="290" rx="22" fill="#fff0f1" stroke="#df7078" stroke-width="2"/><text x="1239" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9e303b">陈旧处理</text><text x="1239" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1239" dy="0">来源 Policy 归档/内容变化时可</tspan><tspan x="1239" dy="28">标 stale</tspan><tspan x="1239" dy="28">重建命中相同 fingerprint 可重</tspan><tspan x="1239" dy="28">新激活</tspan><tspan x="1239" dy="28">检索只选 active 且达到置信度</tspan><tspan x="1239" dy="28">下限</tspan><tspan x="1239" dy="28">历史行仍保留以便审计和证据追</tspan><tspan x="1239" dy="28">踪</tspan></text></g><g><rect x="410" y="960" width="780" height="59" rx="16" fill="#f5efff" stroke="#9f83d5" stroke-width="2" stroke-dasharray="7 6"/><text x="430" y="991" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#624196"><tspan x="430" dy="0">当前实际路由：L3 使用独立 l3Llm；当前配置为 deepseek-v4-flash。</tspan></text></g>
