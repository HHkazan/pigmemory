<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
    <defs><linearGradient id="formula-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf9"/><stop offset="1" stop-color="#f4fbf8"/></linearGradient><filter id="formula-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#6d4a40" flood-opacity="0.10"/></filter></defs>
    <rect width="1200" height="430" rx="28" fill="url(#formula-bg)"/>
    <rect x="34" y="34" width="8" height="76" rx="4" fill="#d86554"/>
    <text x="66" y="65" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#d86554">PIGMEMORY · 核心公式图解</text>
    <text x="66" y="104" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="900" fill="#433735">任务奖励与 Trace 价值回传</text>
    <text x="1160" y="67" text-anchor="end" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#887872">先评价整项任务，再把结果向前分配</text>
    
      <g filter="url(#formula-shadow)"><rect x="42" y="142" width="530" height="238" rx="22" fill="#fff4df" stroke="#d8b45f" stroke-width="2"/><rect x="608" y="142" width="550" height="238" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/></g>
      <text x="72" y="183" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#80611b">① 三轴合成任务奖励</text>
      <text x="307" y="220" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Noto Sans Math, serif" font-size="30" fill="#3f3835">R<tspan baseline-shift="sub" font-size="18">human</tspan> =</text>
      <text x="307" y="273" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Noto Sans Math, serif" font-size="25" fill="#3f3835">clamp(0.45G + 0.30P + 0.25S, −1, 1)</text>
      <g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#6f625c"><text x="105" y="310">G · 目标完成度</text><text x="250" y="310">P · 过程质量</text><text x="390" y="310">S · 用户满意度</text><text x="307" y="352" text-anchor="middle" font-weight="700" fill="#9b6e20">三个输入均限制在 [−1, 1]</text></g>
      <text x="638" y="183" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="800" fill="#285f91">② 从最后一步向前回传</text>
      <text x="883" y="238" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Noto Sans Math, serif" font-size="33" fill="#343d45">V<tspan baseline-shift="sub" font-size="20">T</tspan> = R<tspan baseline-shift="sub" font-size="20">human</tspan></text>
      <text x="883" y="298" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Noto Sans Math, serif" font-size="28" fill="#343d45">V<tspan baseline-shift="sub" font-size="18">t</tspan> = α<tspan baseline-shift="sub" font-size="18">t</tspan>R<tspan baseline-shift="sub" font-size="18">human</tspan> + (1−α<tspan baseline-shift="sub" font-size="18">t</tspan>)γV<tspan baseline-shift="sub" font-size="18">t+1</tspan></text>
      <text x="883" y="350" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#5f6b74">α 越大越相信本步反思；α=0 时只接收后续结果的折扣传播</text>
  </svg>