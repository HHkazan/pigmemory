    <text x="58" y="70" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#d45f50">PIGMEMORY · 原理图 04/12</text><text x="58" y="126" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#3e3635">Capture 双阶段：即时可见与主题级反思如何兼得</text><text x="60" y="166" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#786b67"><tspan x="60" dy="0">同一批 Trace 先快速写入，稍后在完整因果链可见时补反思和 α；两次都做幂等去重。</tspan></text><line x1="58" y1="204" x2="1542" y2="204" stroke="#eadbd4" stroke-width="2"/>
    <g><rect x="36" y="260" width="1528" height="1" fill="#66b79b" opacity="0.5"/><rect x="38" y="239" width="160" height="42" rx="21" fill="#339475"/><text x="118" y="267" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">每回合 runLite</text></g><g><rect x="55" y="300" width="245" height="225" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><circle cx="85" cy="332" r="20" fill="#339475"/><text x="85" y="339" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">1</text><text x="113" y="342" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">Extract</text><text x="79" y="378" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">从完整 Episode 重提</tspan><tspan x="79" dy="28">取</tspan><tspan x="79" dy="28">只保留数据库中尚未出</tspan><tspan x="79" dy="28">现的 ts/签名</tspan><tspan x="79" dy="28">读取去重列时不加载向</tspan><tspan x="79" dy="28">量 BLOB</tspan></text></g><g><rect x="345" y="300" width="245" height="225" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><circle cx="375" cy="332" r="20" fill="#4c88c5"/><text x="375" y="339" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">2</text><text x="403" y="342" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">Normalize</text><text x="369" y="378" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="369" dy="0">截断超长字段</tspan><tspan x="369" dy="28">标准化工具调用</tspan><tspan x="369" dy="28">生成 tags / error si</tspan><tspan x="369" dy="28">gnature</tspan><tspan x="369" dy="28">保持 turnId</tspan></text></g><g><rect x="635" y="300" width="245" height="225" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><circle cx="665" cy="332" r="20" fill="#8064bb"/><text x="665" y="339" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">3</text><text x="693" y="342" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">Summarize</text><text x="659" y="378" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="659" dy="0">主 LLM 生成摘要</tspan><tspan x="659" dy="28">失败时允许空摘要</tspan><tspan x="659" dy="28">此阶段不反思</tspan><tspan x="659" dy="28">α 固定为 0</tspan></text></g><g><rect x="925" y="300" width="245" height="225" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><circle cx="955" cy="332" r="20" fill="#b98b25"/><text x="955" y="339" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">4</text><text x="983" y="342" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">Embed</text><text x="949" y="378" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="949" dy="0">vecSummary</tspan><tspan x="949" dy="28">vecAction</tspan><tspan x="949" dy="28">嵌入失败则写 null</tspan><tspan x="949" dy="28">并进入 embedding ret</tspan><tspan x="949" dy="28">ry queue</tspan></text></g><g><rect x="1215" y="300" width="330" height="225" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><circle cx="1245" cy="332" r="20" fill="#d86554"/><text x="1245" y="339" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">5</text><text x="1273" y="342" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">Persist + lite.done</text><text x="1239" y="378" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1239" dy="0">插入新的 TraceRow</tspan><tspan x="1239" dy="28">更新 Episode.traceIds</tspan><tspan x="1239" dy="28">发 capture.lite.done 供日志展</tspan><tspan x="1239" dy="28">示</tspan><tspan x="1239" dy="28">不会发 capture.done</tspan><tspan x="1239" dy="28">因此不会提前启动 Reward</tspan></text></g><g><path d="M 300 412 L 345 412" fill="none" stroke="#339475" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/><rect x="248.5" y="396" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="322.5" y="418" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1c725a">新步骤</text></g><g><path d="M 590 412 L 635 412" fill="none" stroke="#4c88c5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="538.5" y="396" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="612.5" y="418" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#285f91">规范化</text></g><g><path d="M 880 412 L 925 412" fill="none" stroke="#8064bb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-purple)"/><rect x="828.5" y="396" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="902.5" y="418" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#624196">摘要文本</text></g><g><path d="M 1170 412 L 1215 412" fill="none" stroke="#b98b25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/><rect x="1118.5" y="396" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1192.5" y="418" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#80611b">向量</text></g><g><rect x="36" y="610" width="1528" height="1" fill="#d8b45f" opacity="0.5"/><rect x="38" y="589" width="160" height="42" rx="21" fill="#b98b25"/><text x="118" y="617" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">主题结束 runReflect</text></g><g><rect x="55" y="650" width="270" height="250" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><circle cx="85" cy="682" r="20" fill="#b98b25"/><text x="85" y="689" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">A</text><text x="113" y="692" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">重建完整步骤链</text><text x="79" y="728" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">episode.finalized 触发</tspan><tspan x="79" dy="28">重新 Extract + Normali</tspan><tspan x="79" dy="28">ze</tspan><tspan x="79" dy="28">按 ts/签名匹配既有 Tra</tspan><tspan x="79" dy="28">ce</tspan><tspan x="79" dy="28">恢复时也可补 orphan ro</tspan><tspan x="79" dy="28">ws</tspan></text></g><g><rect x="380" y="650" width="310" height="250" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><circle cx="410" cy="682" r="20" fill="#8064bb"/><text x="410" y="689" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">B</text><text x="438" y="692" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">反思模式选择</text><text x="404" y="728" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="404" dy="0">短 Episode：一次 batch JSO</tspan><tspan x="404" dy="28">N</tspan><tspan x="404" dy="28">长 Episode：分块或逐步</tspan><tspan x="404" dy="28">可注入 task summary</tspan><tspan x="404" dy="28">可预览后续 1..N 步</tspan><tspan x="404" dy="28">避免只看局部误判因果</tspan></text></g><g><rect x="745" y="650" width="270" height="250" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><circle cx="775" cy="682" r="20" fill="#4c88c5"/><text x="775" y="689" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">C</text><text x="803" y="692" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">α Judge</text><text x="769" y="728" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="769" dy="0">输入 state/thinking/ac</tspan><tspan x="769" dy="28">tion</tspan><tspan x="769" dy="28">+ tool outcome</tspan><tspan x="769" dy="28">+ downstream preview</tspan><tspan x="769" dy="28">+ reflection</tspan><tspan x="769" dy="28">输出 alpha, usable, re</tspan><tspan x="769" dy="28">ason</tspan></text></g><g><rect x="1070" y="650" width="245" height="250" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><circle cx="1100" cy="682" r="20" fill="#339475"/><text x="1100" y="689" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">D</text><text x="1128" y="692" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">Patch</text><text x="1094" y="728" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1094" dy="0">updateReflection(id)</tspan><tspan x="1094" dy="28">只补 reflection + α</tspan><tspan x="1094" dy="28">不重复插入 Trace</tspan><tspan x="1094" dy="28">malformed/LLM 失败 →</tspan><tspan x="1094" dy="28"> α=0</tspan></text></g><g><rect x="1370" y="650" width="175" height="250" rx="22" fill="#fff0f1" stroke="#df7078" stroke-width="2"/><circle cx="1400" cy="682" r="20" fill="#ca4c57"/><text x="1400" y="689" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">E</text><text x="1428" y="692" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9e303b">done</text><text x="1394" y="728" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="450" fill="#45515a"><tspan x="1394" dy="0">发 capture.done</tspan><tspan x="1394" dy="26">开启 30 秒反馈窗</tspan><tspan x="1394" dy="26">进入奖励链</tspan></text></g><g><path d="M 325 775 L 380 775" fill="none" stroke="#b98b25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/><rect x="278.5" y="759" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="352.5" y="781" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#80611b">全链</text></g><g><path d="M 690 775 L 745 775" fill="none" stroke="#8064bb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-purple)"/><rect x="643.5" y="759" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="717.5" y="781" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#624196">reflection</text></g><g><path d="M 1015 775 L 1070 775" fill="none" stroke="#4c88c5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="968.5" y="759" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1042.5" y="781" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#285f91">α</text></g><g><path d="M 1315 775 L 1370 775" fill="none" stroke="#339475" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/><rect x="1268.5" y="759" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1342.5" y="781" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1c725a">完成</text></g><g><rect x="335" y="955" width="930" height="59" rx="16" fill="#f5f6f7" stroke="#a8b0b6" stroke-width="2" stroke-dasharray="7 6"/><text x="355" y="986" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#4e5961"><tspan x="355" dy="0">轻量内存模式是另一条路径：每个用户—助手回合合并成一条 Trace，只保留摘要向量；Reward / L2 / L3 / Sk</tspan><tspan x="355" dy="26">ill / Feedback subscriber 全部不挂载。</tspan></text></g>
