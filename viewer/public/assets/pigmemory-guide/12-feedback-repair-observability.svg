    <rect width="1600" height="1100" fill="url(#bg)"/>
    <text x="58" y="70" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#d45f50">PIGMEMORY · 原理图 12/12</text><text x="58" y="126" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#3e3635">反馈、重复失败修复与可观测性</text><text x="60" y="166" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#786b67"><tspan x="60" dy="0">负反馈不会只改一个总分：它既能改变 Trace/Policy/Skill，也能在连续工具失败时生成并召回“不要再这样做”的修复经验。</tspan></text><line x1="58" y1="204" x2="1542" y2="204" stroke="#eadbd4" stroke-width="2"/>
    <g><rect x="55" y="245" width="285" height="265" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><circle cx="85" cy="277" r="20" fill="#d86554"/><text x="85" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">1</text><text x="113" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">反馈来源</text><text x="79" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">显式：点赞/点踩/纠正文本</tspan><tspan x="79" dy="28">隐式：会话中可识别信号</tspan><tspan x="79" dy="28">晚到反馈：无 pending 窗</tspan><tspan x="79" dy="28">口也立即重算</tspan><tspan x="79" dy="28">按 episodeId 关联</tspan><tspan x="79" dy="28">同一任务反馈合并后评分</tspan></text></g><g><rect x="380" y="245" width="285" height="265" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><circle cx="410" cy="277" r="20" fill="#4c88c5"/><text x="410" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">2</text><text x="438" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">基础影响</text><text x="404" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="404" dy="0">重算 R_human</tspan><tspan x="404" dy="28">重新 backprop 每条 Trace</tspan><tspan x="404" dy="28"> 的 V/priority</tspan><tspan x="404" dy="28">触发 L2 support/gain 更</tspan><tspan x="404" dy="28">新</tspan><tspan x="404" dy="28">触发 Skill trial / η 更</tspan><tspan x="404" dy="28">新</tspan><tspan x="404" dy="28">结果通过事件总线级联</tspan></text></g><g><rect x="705" y="245" width="300" height="265" rx="22" fill="#fff0f1" stroke="#df7078" stroke-width="2"/><circle cx="735" cy="277" r="20" fill="#ca4c57"/><text x="735" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">3</text><text x="763" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9e303b">重复失败检测</text><text x="729" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="729" dy="0">按 failing tool 观察滑动</tspan><tspan x="729" dy="28">窗口</tspan><tspan x="729" dy="28">达到 failureThreshold（默</tspan><tspan x="729" dy="28">认 3）</tspan><tspan x="729" dy="28">收集失败 Trace / error si</tspan><tspan x="729" dy="28">gnatures</tspan><tspan x="729" dy="28">受 cooldown 控制</tspan><tspan x="729" dy="28">生成 preference 与 anti-p</tspan><tspan x="729" dy="28">attern</tspan></text></g><g><rect x="1045" y="245" width="285" height="265" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><circle cx="1075" cy="277" r="20" fill="#b98b25"/><text x="1075" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">4</text><text x="1103" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">修复 Experience</text><text x="1069" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1069" dy="0">写成 feedback 类型 Polic</tspan><tspan x="1069" dy="28">y</tspan><tspan x="1069" dy="28">带 salience / confidence</tspan><tspan x="1069" dy="28">保存 feedbackIds / trace</tspan><tspan x="1069" dy="28">Ids / episodeIds</tspan><tspan x="1069" dy="28">可挂到已有 Policy</tspan><tspan x="1069" dy="28">低显著性 candidate，高显</tspan><tspan x="1069" dy="28">著性 active</tspan></text></g><g><rect x="1370" y="245" width="175" height="265" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><circle cx="1400" cy="277" r="20" fill="#8064bb"/><text x="1400" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">5</text><text x="1428" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">Repair 召回</text><text x="1394" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="450" fill="#45515a"><tspan x="1394" dy="0">失败循环中调用 dec</tspan><tspan x="1394" dy="25">ision_repair</tspan><tspan x="1394" dy="25">Tier1+Tier2</tspan><tspan x="1394" dy="25">允许低/负 V</tspan><tspan x="1394" dy="25">注入 avoid/repair </tspan><tspan x="1394" dy="25">提示</tspan></text></g><g><path d="M 340 378 L 380 378" fill="none" stroke="#d86554" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-coral)"/><rect x="286" y="362" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="360" y="384" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9b3f31">score</text></g><g><path d="M 665 378 L 705 378" fill="none" stroke="#4c88c5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="611" y="362" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="685" y="384" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#285f91">error</text></g><g><path d="M 1005 378 L 1045 378" fill="none" stroke="#ca4c57" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/><rect x="951" y="362" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1025" y="384" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9e303b">synthesize</text></g><g><path d="M 1330 378 L 1370 378" fill="none" stroke="#b98b25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/><rect x="1276" y="362" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1350" y="384" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#80611b">retrieve</text></g><g><rect x="36" y="575" width="1528" height="1" fill="#66b79b" opacity="0.5"/><rect x="38" y="554" width="160" height="42" rx="21" fill="#339475"/><text x="118" y="582" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">每一步怎样被看见</text></g><g><rect x="55" y="625" width="330" height="285" rx="22" fill="#f5f6f7" stroke="#a8b0b6" stroke-width="2"/><text x="79" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#4e5961">结构化日志</text><text x="79" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">api_logs：宿主工具/流程操作</tspan><tspan x="79" dy="28">operational log：阶段、错误、</tspan><tspan x="79" dy="28">耗时</tspan><tspan x="79" dy="28">llm.jsonl：op / model / laten</tspan><tspan x="79" dy="28">cy / token</tspan><tspan x="79" dy="28">perf.jsonl：性能</tspan><tspan x="79" dy="28">events.jsonl：事件流</tspan><tspan x="79" dy="28">audit log：安全与管理操作</tspan></text></g><g><rect x="425" y="625" width="340" height="285" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><text x="449" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">检索审计</text><text x="449" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="449" dy="0">query tags / scenario / embedd</tspan><tspan x="449" dy="28">ing 降级</tspan><tspan x="449" dy="28">各 Tier 候选数量</tspan><tspan x="449" dy="28">channel hits</tspan><tspan x="449" dy="28">阈值丢弃与多通道豁免</tspan><tspan x="449" dy="28">MMR 结果</tspan><tspan x="449" dy="28">LLM filter kept/dropped</tspan><tspan x="449" dy="28">最终 packet 与适配器确认</tspan></text></g><g><rect x="805" y="625" width="340" height="285" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><text x="829" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">持久化证据链</text><text x="829" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="829" dy="0">Episode → Trace IDs</tspan><tspan x="829" dy="28">Trace ↔ Policy links</tspan><tspan x="829" dy="28">Policy → source Episode IDs</tspan><tspan x="829" dy="28">WorldModel → Policy + Episode</tspan><tspan x="829" dy="28">Skill → Policy + Trace + Episo</tspan><tspan x="829" dy="28">de</tspan><tspan x="829" dy="28">Feedback Experience → Feedback</tspan><tspan x="829" dy="28"> + Trace</tspan><tspan x="829" dy="28">所有层都可回溯到原始行为</tspan></text></g><g><rect x="1185" y="625" width="360" height="285" rx="22" fill="#fff0f1" stroke="#df7078" stroke-width="2"/><text x="1209" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9e303b">故障与恢复</text><text x="1209" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1209" dy="0">Embedding 失败：null vector + re</tspan><tspan x="1209" dy="28">try queue</tspan><tspan x="1209" dy="28">LLM malformed：有限重试，随后按</tspan><tspan x="1209" dy="28">阶段 fail-open/skip</tspan><tspan x="1209" dy="28">进程关闭：flush pending reward，</tspan><tspan x="1209" dy="28">不等满 30 秒</tspan><tspan x="1209" dy="28">启动恢复：扫描 dirty/未完成 Epis</tspan><tspan x="1209" dy="28">ode</tspan><tspan x="1209" dy="28">幂等签名避免重复 Trace / Policy </tspan><tspan x="1209" dy="28">/ WorldModel</tspan><tspan x="1209" dy="28">轻量模式明确短路进化 subscriber</tspan></text></g><g><rect x="350" y="960" width="900" height="59" rx="16" fill="#fff8df" stroke="#d8b45f" stroke-width="2" stroke-dasharray="7 6"/><text x="370" y="991" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#80611b"><tspan x="370" dy="0">阅读日志时要区分四件事：产生候选、机械保留、LLM 保留、适配器实际接收。只有最后一步才接近“进入 A</tspan><tspan x="370" dy="26">gent 本回合上下文”。</tspan></text></g>
