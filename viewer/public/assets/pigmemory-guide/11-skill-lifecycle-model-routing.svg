    <text x="58" y="70" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#d45f50">PIGMEMORY · 原理图 11/12</text><text x="58" y="126" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#3e3635">Skill 结晶、试用与模型路由：当前真实行为</text><text x="60" y="166" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#786b67"><tspan x="60" dy="0">Skill 是由 active Policy 与证据打包出的可调用能力；验证通过也只进入 candidate，必须靠真实结果建立 η。</tspan></text><line x1="58" y1="204" x2="1542" y2="204" stroke="#eadbd4" stroke-width="2"/>
    <g><rect x="55" y="245" width="255" height="265" rx="22" fill="#eef8e9" stroke="#83b86b" stroke-width="2"/><circle cx="85" cy="277" r="20" fill="#619b49"/><text x="85" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">1</text><text x="113" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#40732e">Eligibility</text><text x="79" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="450" fill="#45515a"><tspan x="79" dy="0">来源：指定 Policy 或全</tspan><tspan x="79" dy="24">部 active Policy</tspan><tspan x="79" dy="24">检查 support / gain</tspan><tspan x="79" dy="24">检查冷却与现有版本</tspan><tspan x="79" dy="24">决定 skip / crystallize</tspan><tspan x="79" dy="24"> / rebuild</tspan></text></g><g><rect x="345" y="245" width="270" height="265" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><circle cx="375" cy="277" r="20" fill="#4c88c5"/><text x="375" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">2</text><text x="403" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">Evidence</text><text x="369" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="450" fill="#45515a"><tspan x="369" dy="0">拉取关联的高价值 Trace</tspan><tspan x="369" dy="24">保存 Trace / Episode 证据</tspan><tspan x="369" dy="24"> ID</tspan><tspan x="369" dy="24">同 Episode 内补取 V&lt;0 反</tspan><tspan x="369" dy="24">例</tspan><tspan x="369" dy="24">Policy guidance → repair </tspan><tspan x="369" dy="24">hints</tspan></text></g><g><rect x="650" y="245" width="270" height="265" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><circle cx="680" cy="277" r="20" fill="#8064bb"/><text x="680" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">3</text><text x="708" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">Crystallize</text><text x="674" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="450" fill="#45515a"><tspan x="674" dy="0">LLM 生成 name / summary /</tspan><tspan x="674" dy="24"> parameters</tspan><tspan x="674" dy="24">生成 invocationGuide</tspan><tspan x="674" dy="24">提取 evidence tools</tspan><tspan x="674" dy="24">规范化并过滤危险/空内容</tspan><tspan x="674" dy="24">失败可按约束重试一次</tspan></text></g><g><rect x="955" y="245" width="265" height="265" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><circle cx="985" cy="277" r="20" fill="#b98b25"/><text x="985" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">4</text><text x="1013" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">Verify + Package</text><text x="979" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="450" fill="#45515a"><tspan x="979" dy="0">校验证据覆盖与一致性</tspan><tspan x="979" dy="24">生成 content fingerprint</tspan><tspan x="979" dy="24">写技能向量</tspan><tspan x="979" dy="24">重建版指向 supersedesSkil</tspan><tspan x="979" dy="24">lId</tspan><tspan x="979" dy="24">验证通过也不会直接 active</tspan></text></g><g><rect x="1255" y="245" width="290" height="265" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><circle cx="1285" cy="277" r="20" fill="#d86554"/><text x="1285" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">5</text><text x="1313" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">Candidate 试用</text><text x="1279" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="450" fill="#45515a"><tspan x="1279" dy="0">调用成功创建 pending trial</tspan><tspan x="1279" dy="24">Reward：R≥0.5 pass；R≤−0.5 f</tspan><tspan x="1279" dy="24">ail</tspan><tspan x="1279" dy="24">其余为 unknown</tspan><tspan x="1279" dy="24">pass 达次数且 η 达标 → activ</tspan><tspan x="1279" dy="24">e</tspan><tspan x="1279" dy="24">candidate 首次 fail → archiv</tspan><tspan x="1279" dy="24">ed</tspan></text></g><g><path d="M 310 378 L 345 378" fill="none" stroke="#619b49" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="253.5" y="362" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="327.5" y="384" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#40732e">eligible</text></g><g><path d="M 615 378 L 650 378" fill="none" stroke="#4c88c5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="558.5" y="362" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="632.5" y="384" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#285f91">证据</text></g><g><path d="M 920 378 L 955 378" fill="none" stroke="#8064bb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-purple)"/><rect x="863.5" y="362" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="937.5" y="384" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#624196">draft</text></g><g><path d="M 1220 378 L 1255 378" fill="none" stroke="#b98b25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/><rect x="1163.5" y="362" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1237.5" y="384" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#80611b">candidate</text></g><g><rect x="36" y="575" width="1528" height="1" fill="#df7078" opacity="0.5"/><rect x="38" y="554" width="160" height="42" rx="21" fill="#ca4c57"/><text x="118" y="582" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">η 与当前模型接线</text></g><g><rect x="55" y="625" width="470" height="300" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><text x="79" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">Skill η 生命周期</text><text x="79" y="703" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, Noto Sans Mono CJK SC, monospace" font-size="17" font-weight="450" fill="#45515a"><tspan x="79" dy="0">trial η：把初始 η 当 1 个伪观测，再合并 pass </tspan><tspan x="79" dy="26">ratio</tspan><tspan x="79" dy="26">user.positive / negative：η ± etaDelta</tspan><tspan x="79" dy="26">reward drift：η' = 0.7×旧η + 0.3×clamp(policy</tspan><tspan x="79" dy="26">Gain)</tspan><tspan x="79" dy="26">active 且 η &lt; archiveEta → archived</tspan><tspan x="79" dy="26">archived 收到足够正反馈可回 candidate</tspan><tspan x="79" dy="26">重建版本先 candidate，成功后原子替换旧 active</tspan></text></g><g><rect x="575" y="625" width="420" height="300" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><text x="599" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">配置看起来想要的路由</text><text x="599" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="599" dy="0">主 llm：MiniMax-M3</tspan><tspan x="599" dy="28">skillEvolver：deepseek-v4-flash</tspan><tspan x="599" dy="28">l3Llm：deepseek-v4-flash</tspan><tspan x="599" dy="28">schema 注释称 skillEvolver 用于</tspan><tspan x="599" dy="28">反思 / L2 / Skill 结晶</tspan><tspan x="599" dy="28">这是“配置意图”，不是当前实际调用</tspan></text></g><g><rect x="1045" y="625" width="500" height="300" rx="22" fill="#fff0f1" stroke="#df7078" stroke-width="2"/><text x="1069" y="667" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9e303b">当前源码实际路由（重要）</text><text x="1069" y="703" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="450" fill="#45515a"><tspan x="1069" dy="0">Capture 摘要 + 主题反思：主 bgLlm（MiniMax-M3）</tspan><tspan x="1069" dy="23">R_human：主 bgLlm（MiniMax-M3）</tspan><tspan x="1069" dy="23">L2 induction：主 bgLlm（MiniMax-M3）</tspan><tspan x="1069" dy="23">Skill crystallize：主 bgLlm（MiniMax-M3）</tspan><tspan x="1069" dy="23">Feedback repair：主 bgLlm（MiniMax-M3）</tspan><tspan x="1069" dy="23">仅 L3 abstraction 用 l3Llm（deepseek-v4-flash）</tspan><tspan x="1069" dy="23">skillEvolver 仅作为 evaluator 元数据，未参与推理</tspan></text></g><g><rect x="330" y="965" width="940" height="59" rx="16" fill="#fff0f1" stroke="#df7078" stroke-width="2" stroke-dasharray="7 6"/><text x="350" y="996" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#9e303b"><tspan x="350" dy="0">结论：Skill 功能本身在运行；失效的是“专用 skillEvolver 模型选择”。当前不阻断流程，但会让模型分工、成</tspan><tspan x="350" dy="26">本与能力预期失真。</tspan></text></g>
    <text x="1540" y="1070" text-anchor="end" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#9a8c87">依据当前源码执行链绘制 · 2026-08-07</text>
  </svg>