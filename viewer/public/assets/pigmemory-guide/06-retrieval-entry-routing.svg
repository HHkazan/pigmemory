<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
    <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf9"/><stop offset="0.55" stop-color="#fff9f3"/><stop offset="1" stop-color="#eef8f4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5e4037" flood-opacity="0.10"/></filter>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d86554"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#339475"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4c88c5"/></marker><marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b98b25"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8064bb"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77838c"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ca4c57"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#619b49"/></marker>
  </defs>
    <rect width="1600" height="1100" fill="url(#bg)"/>
    <text x="58" y="70" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#d45f50">PIGMEMORY · 原理图 06/12</text><text x="58" y="126" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#3e3635">检索入口：不同触发时机为什么查不同层</text><text x="60" y="166" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#786b67"><tspan x="60" dy="0">五个内部入口共用同一条召回—排序—过滤管线，但 Tier 开关、负样本策略和预算不同。</tspan></text><line x1="58" y1="204" x2="1542" y2="204" stroke="#eadbd4" stroke-width="2"/>
    <g><rect x="55" y="245" width="290" height="250" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><text x="79" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">turn_start</text><text x="79" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">新用户回合开始</tspan><tspan x="79" dy="28">Tier 1 + Tier 2 + Tier 3</tspan><tspan x="79" dy="28">完整预算</tspan><tspan x="79" dy="28">当前 session 的旧 Trace </tspan><tspan x="79" dy="28">通常排除</tspan><tspan x="79" dy="28">意图调度可覆盖各 Tier</tspan></text></g><g><rect x="365" y="245" width="290" height="250" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><text x="389" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">tool_driven</text><text x="389" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="389" dy="0">Agent 显式搜索</tspan><tspan x="389" dy="28">默认 Tier 2 + Tier 3</tspan><tspan x="389" dy="28">Tier 1 可由 plan 开启</tspan><tspan x="389" dy="28">预算偏小</tspan><tspan x="389" dy="28">query 来自参数与 tool na</tspan><tspan x="389" dy="28">me</tspan></text></g><g><rect x="675" y="245" width="290" height="250" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><text x="699" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">skill_invoke</text><text x="699" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="699" dy="0">即将执行某个技能</tspan><tspan x="699" dy="28">Tier 1 主导 + 少量 Tier </tspan><tspan x="699" dy="28">2</tspan><tspan x="699" dy="28">不查 Tier 3</tspan><tspan x="699" dy="28">用于校验技能是否适用</tspan><tspan x="699" dy="28">可补充相似历史步骤</tspan></text></g><g><rect x="985" y="245" width="290" height="250" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><text x="1009" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">sub_agent</text><text x="1009" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1009" dy="0">给子 Agent 准备上下文</tspan><tspan x="1009" dy="28">Tier 2 + Tier 3</tspan><tspan x="1009" dy="28">不注入 Tier 1</tspan><tspan x="1009" dy="28">query = profile + missio</tspan><tspan x="1009" dy="28">n</tspan><tspan x="1009" dy="28">避免把父 Agent 技能强塞</tspan><tspan x="1009" dy="28">给子任务</tspan></text></g><g><rect x="1295" y="245" width="250" height="250" rx="22" fill="#fff0f1" stroke="#df7078" stroke-width="2"/><text x="1319" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9e303b">decision_repair</text><text x="1319" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="450" fill="#45515a"><tspan x="1319" dy="0">重复工具失败后</tspan><tspan x="1319" dy="26">Tier 1 + Tier 2</tspan><tspan x="1319" dy="26">includeLowValue=true</tspan><tspan x="1319" dy="26">允许找 priority=0 的反</tspan><tspan x="1319" dy="26">例</tspan><tspan x="1319" dy="26">无失败或无结果则不注入</tspan></text></g><g><rect x="36" y="565" width="1528" height="1" fill="#d8b45f" opacity="0.5"/><rect x="38" y="544" width="160" height="42" rx="21" fill="#b98b25"/><text x="118" y="572" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">Query 编译</text></g><g><rect x="55" y="615" width="350" height="270" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><circle cx="85" cy="647" r="20" fill="#b98b25"/><text x="85" y="654" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">1</text><text x="113" y="657" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">主检索文本</text><text x="79" y="693" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">turn_start：只嵌入本轮用户原文</tspan><tspan x="79" dy="28">tool：query + 其余 args</tspan><tspan x="79" dy="28">skill：skillId + query</tspan><tspan x="79" dy="28">sub-agent：profile + mission</tspan><tspan x="79" dy="28">repair：失败工具 + 错误序列</tspan><tspan x="79" dy="28">最长 1500 字，保留首尾</tspan></text></g><g><rect x="455" y="615" width="350" height="270" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><circle cx="485" cy="647" r="20" fill="#339475"/><text x="485" y="654" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">2</text><text x="513" y="657" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">派生结构</text><text x="479" y="693" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="479" dy="0">tags：关键词映射</tspan><tspan x="479" dy="28">structuralFragments：错误签名</tspan><tspan x="479" dy="28">ftsMatch：SQLite FTS5 表达式</tspan><tspan x="479" dy="28">patternTerms：短中文/混合关键词</tspan><tspan x="479" dy="28">原始文本本身不会被改写成历史答</tspan><tspan x="479" dy="28">案</tspan></text></g><g><rect x="855" y="615" width="330" height="270" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><circle cx="885" cy="647" r="20" fill="#4c88c5"/><text x="885" y="654" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">3</text><text x="913" y="657" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">降级策略</text><text x="879" y="693" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="879" dy="0">优先生成 query embedding</tspan><tspan x="879" dy="28">嵌入失败不终止</tspan><tspan x="879" dy="28">只要 FTS 或 pattern 可用就继</tspan><tspan x="879" dy="28">续</tspan><tspan x="879" dy="28">所有通道都不可用才返回空</tspan><tspan x="879" dy="28">降级状态写入检索统计</tspan></text></g><g><rect x="1235" y="615" width="310" height="270" rx="22" fill="#f5f6f7" stroke="#a8b0b6" stroke-width="2"/><circle cx="1265" cy="647" r="20" fill="#77838c"/><text x="1265" y="654" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">4</text><text x="1293" y="657" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#4e5961">轻量模式差异</text><text x="1259" y="693" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1259" dy="0">所有入口退化为 Trace-only</tspan><tspan x="1259" dy="28">turn_start / tool / skill </tspan><tspan x="1259" dy="28">/ sub-agent 只查 Tier 2 Tr</tspan><tspan x="1259" dy="28">ace</tspan><tspan x="1259" dy="28">Decision Repair 直接禁用</tspan><tspan x="1259" dy="28">仍保留摘要、向量、FTS、LLM</tspan><tspan x="1259" dy="28"> 过滤</tspan></text></g><g><path d="M 405 750 L 455 750" fill="none" stroke="#b98b25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/><rect x="356" y="734" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="430" y="756" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#80611b">编译</text></g><g><path d="M 805 750 L 855 750" fill="none" stroke="#339475" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/><rect x="756" y="734" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="830" y="756" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1c725a">嵌入</text></g><g><path d="M 1185 750 L 1235 750" fill="none" stroke="#4c88c5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="1136" y="734" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1210" y="756" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#285f91">模式开关</text></g><g><rect x="350" y="945" width="900" height="59" rx="16" fill="#fff8df" stroke="#d8b45f" stroke-width="2" stroke-dasharray="7 6"/><text x="370" y="976" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#80611b"><tspan x="370" dy="0">注意：这些是 core 内部纯函数入口。宿主公开工具仍可能只暴露其中一部分参数组合；图 6 描述的是实际</tspan><tspan x="370" dy="26">算法能力，不等于每个 JSON-RPC 方法都完整开放。</tspan></text></g>
    <text x="1540" y="1070" text-anchor="end" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#9a8c87">依据当前源码执行链绘制 · 2026-08-07</text>
  </svg>