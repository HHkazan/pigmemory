    <rect width="1600" height="1100" fill="url(#bg)"/>
    <text x="58" y="70" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#d45f50">PIGMEMORY · 原理图 09/12</text><text x="58" y="126" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#3e3635">L2 Policy：多条 Trace 怎样归纳成可复用经验</text><text x="60" y="166" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#786b67"><tspan x="60" dy="0">L2 不是摘要升级；它先关联已有策略，未匹配的证据进候选池，达到条件后才调用归纳模型。</tspan></text><line x1="58" y1="204" x2="1542" y2="204" stroke="#eadbd4" stroke-width="2"/>
    <g><rect x="55" y="245" width="265" height="255" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><circle cx="85" cy="277" r="20" fill="#4c88c5"/><text x="85" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">1</text><text x="113" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">入口过滤</text><text x="79" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">reward.updated 触发</tspan><tspan x="79" dy="28">只取 V ≥ minTraceValue</tspan><tspan x="79" dy="28">且至少有一个向量</tspan><tspan x="79" dy="28">当前配置 minTraceValue</tspan><tspan x="79" dy="28"> 继承算法设置</tspan><tspan x="79" dy="28">负值 Trace 不作正向归</tspan><tspan x="79" dy="28">纳证据</tspan></text></g><g><rect x="360" y="245" width="270" height="255" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><circle cx="390" cy="277" r="20" fill="#339475"/><text x="390" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">2</text><text x="418" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">关联已有 Policy</text><text x="384" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="384" dy="0">搜索 active + candidat</tspan><tspan x="384" dy="28">e</tspan><tspan x="384" dy="28">比较向量相似与模式签名</tspan><tspan x="384" dy="28">达到 minSimilarity → </tspan><tspan x="384" dy="28">建 trace↔policy link</tspan><tspan x="384" dy="28">support 按不同 episode</tspan><tspan x="384" dy="28"> 计数</tspan></text></g><g><rect x="670" y="245" width="270" height="255" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><circle cx="700" cy="277" r="20" fill="#b98b25"/><text x="700" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">3</text><text x="728" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">未匹配进候选池</text><text x="694" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="694" dy="0">按 PatternSignature 分</tspan><tspan x="694" dy="28">桶</tspan><tspan x="694" dy="28">候选有 TTL</tspan><tspan x="694" dy="28">同一 episode 多条 Trac</tspan><tspan x="694" dy="28">e 不冒充多份独立证据</tspan><tspan x="694" dy="28">达到 minDistinctEpisod</tspan><tspan x="694" dy="28">es 才 ready</tspan></text></g><g><rect x="980" y="245" width="270" height="255" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><circle cx="1010" cy="277" r="20" fill="#8064bb"/><text x="1010" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">4</text><text x="1038" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">归纳结构化策略</text><text x="1004" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1004" dy="0">每个 Episode 只选一条</tspan><tspan x="1004" dy="28">最佳证据</tspan><tspan x="1004" dy="28">LLM 输出 title / trigg</tspan><tspan x="1004" dy="28">er / procedure / verif</tspan><tspan x="1004" dy="28">ication / boundary</tspan><tspan x="1004" dy="28">先做向量/内容重复检测</tspan><tspan x="1004" dy="28">新行初始 candidate</tspan></text></g><g><rect x="1290" y="245" width="255" height="255" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><circle cx="1320" cy="277" r="20" fill="#d86554"/><text x="1320" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">5</text><text x="1348" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">链接与持久化</text><text x="1314" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="450" fill="#45515a"><tspan x="1314" dy="0">写 policies</tspan><tspan x="1314" dy="26">候选池行标记 policyId</tspan><tspan x="1314" dy="26">写 trace_policy_links</tspan><tspan x="1314" dy="26">向量失败进入 retry que</tspan><tspan x="1314" dy="26">ue</tspan><tspan x="1314" dy="26">发 l2.policy.induced /</tspan><tspan x="1314" dy="26"> updated</tspan></text></g><g><path d="M 320 375 L 360 375" fill="none" stroke="#4c88c5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="266" y="359" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="340" y="381" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#285f91">eligible</text></g><g><path d="M 630 375 L 670 375" fill="none" stroke="#339475" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/><rect x="576" y="359" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="650" y="381" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1c725a">unmatched</text></g><g><path d="M 940 375 L 980 375" fill="none" stroke="#b98b25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/><rect x="886" y="359" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="960" y="381" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#80611b">ready</text></g><g><path d="M 1250 375 L 1290 375" fill="none" stroke="#8064bb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-purple)"/><rect x="1196" y="359" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1270" y="381" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#624196">draft</text></g><g><rect x="36" y="570" width="1528" height="1" fill="#83b86b" opacity="0.5"/><rect x="38" y="549" width="160" height="42" rx="21" fill="#619b49"/><text x="118" y="577" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">Gain 与生命周期</text></g><g><rect x="55" y="620" width="500" height="300" rx="22" fill="#eef8e9" stroke="#83b86b" stroke-width="2"/><text x="79" y="662" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#40732e">基础 Gain（保留原算法）</text><text x="79" y="698" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, Noto Sans Mono CJK SC, monospace" font-size="17" font-weight="450" fill="#45515a"><tspan x="79" dy="0">with = 与 Policy 关联的 episode value</tspan><tspan x="79" dy="26">without = 近期其他 episode value</tspan><tspan x="79" dy="26">effectiveWith = 样本≥3 ? softmax 加权 : 普通均值</tspan><tspan x="79" dy="26">baseline = clamp(poolMean, 0.2, 0.5)</tspan><tspan x="79" dy="26">B = (withoutMean×n + baseline×5)/(n+5)</tspan><tspan x="79" dy="26">rawBase = effectiveWith − B</tspan><tspan x="79" dy="26">baseGain = EMA(rawBase, oldBase, α=0.4)</tspan></text></g><g><rect x="615" y="620" width="390" height="300" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><text x="639" y="662" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">实际送达修正</text><text x="639" y="698" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, Noto Sans Mono CJK SC, monospace" font-size="17" font-weight="450" fill="#45515a"><tspan x="639" dy="0">actual = 最终返回且 adapter 确认接收</tspan><tspan x="639" dy="26">的 Episode</tspan><tspan x="639" dy="26">actualUsageCount = 不同 Episode 数</tspan><tspan x="639" dy="26">0 次：尚未调用</tspan><tspan x="639" dy="26">1 次：样本不足，不计算</tspan><tspan x="639" dy="26">n≥2：actualGain = delivered − other</tspan><tspan x="639" dy="26">w = min(0.9, (n−1)/(n+0.5))</tspan><tspan x="639" dy="26">2 次时 w=40%</tspan></text></g><g><rect x="1065" y="620" width="480" height="300" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><text x="1089" y="662" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">最终 Gain 与生命周期</text><text x="1089" y="698" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="450" fill="#45515a"><tspan x="1089" dy="0">n&lt;2：finalGain = baseGain</tspan><tspan x="1089" dy="23">n≥2：finalGain = (1−w)×baseGain + w×actualGain</tspan><tspan x="1089" dy="23">2 次实际 Gain 占 40%，随后逐步升至最多 90%</tspan><tspan x="1089" dy="23">candidate → active：support 与 finalGain 达标</tspan><tspan x="1089" dy="23">active → archived：finalGain 过低或 support=0</tspan><tspan x="1089" dy="23">检索、L3、Skill 统一读取 finalGain</tspan><tspan x="1089" dy="23">Viewer 同时展示 base / actual / final</tspan></text></g>
    <text x="1540" y="1070" text-anchor="end" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#9a8c87">依据当前源码执行链绘制 · 2026-08-07</text>
