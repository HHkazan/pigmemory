    <text x="58" y="70" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#d45f50">PIGMEMORY · 原理图 08/12</text><text x="58" y="126" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#3e3635">检索排序：从候选融合到最终安全注入</text><text x="60" y="166" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#786b67"><tspan x="60" dy="0">机械排序解决“相关 + 高价值 + 不重复”；LLM 过滤解决“当前问题真的用得上吗”；两者职责分离。</tspan></text><line x1="58" y1="204" x2="1542" y2="204" stroke="#eadbd4" stroke-width="2"/>
    <g><rect x="55" y="245" width="300" height="280" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><circle cx="85" cy="277" r="20" fill="#4c88c5"/><text x="85" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">1</text><text x="113" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">基础相关度</text><text x="79" y="323" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, Noto Sans Mono CJK SC, monospace" font-size="15" font-weight="450" fill="#45515a"><tspan x="79" dy="0">base = max(channel.score)</tspan><tspan x="79" dy="22">RRF = Σ 1/(k + rank_i + 1)</tspan><tspan x="79" dy="22">relevance = base + 0.4×RRF + bo</tspan><tspan x="79" dy="22">ost</tspan><tspan x="79" dy="22">Trace/Episode ≤ 0.3×priority</tspan><tspan x="79" dy="22">Skill = 0.15×η − candidatePenal</tspan><tspan x="79" dy="22">ty</tspan><tspan x="79" dy="22">普通 L2 = 0.15×gain + 0.05×supp</tspan><tspan x="79" dy="22">ort/(support+3)</tspan><tspan x="79" dy="22">反馈经验 = 0.2×max(salience,con</tspan><tspan x="79" dy="22">fidence,gain)</tspan><tspan x="79" dy="22">candidate 质量加成再 ×0.75</tspan><tspan x="79" dy="22">WorldModel = 0.1×confidence</tspan></text></g><g><rect x="390" y="245" width="270" height="280" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><circle cx="420" cy="277" r="20" fill="#b98b25"/><text x="420" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">2</text><text x="448" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">相对阈值</text><text x="414" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="414" dy="0">top = 全池最高 relevan</tspan><tspan x="414" dy="28">ce</tspan><tspan x="414" dy="28">cutoff = top × relativ</tspan><tspan x="414" dy="28">eFloor</tspan><tspan x="414" dy="28">低于 cutoff 的单通道候</tspan><tspan x="414" dy="28">选丢弃</tspan><tspan x="414" dy="28">命中 ≥2 通道可豁免</tspan><tspan x="414" dy="28">豁免仍要参加去重</tspan></text></g><g><rect x="695" y="245" width="300" height="280" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><circle cx="725" cy="277" r="20" fill="#8064bb"/><text x="725" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">3</text><text x="753" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">Smart-seed + MMR</text><text x="719" y="323" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, Noto Sans Mono CJK SC, monospace" font-size="17" font-weight="450" fill="#45515a"><tspan x="719" dy="0">每 Tier 最多先播 1 个种子</tspan><tspan x="719" dy="26">前提：tierBest ≥ poolTop×0.</tspan><tspan x="719" dy="26">7</tspan><tspan x="719" dy="26">MMR(c)=λ×relevance</tspan><tspan x="719" dy="26">       −(1−λ)×maxCos(c,sele</tspan><tspan x="719" dy="26">cted)</tspan><tspan x="719" dy="26">然后贪心补满 limit</tspan><tspan x="719" dy="26">candidate Skill 还有独立数</tspan><tspan x="719" dy="26">量上限</tspan></text></g><g><rect x="1030" y="245" width="250" height="280" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><circle cx="1060" cy="277" r="20" fill="#d86554"/><text x="1060" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">4</text><text x="1088" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">LLM 精排</text><text x="1054" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1054" dy="0">把机械候选和当前 que</tspan><tspan x="1054" dy="28">ry 交给过滤模型</tspan><tspan x="1054" dy="28">输出保留 id + suffic</tspan><tspan x="1054" dy="28">ient</tspan><tspan x="1054" dy="28">超时、禁用、解析失败</tspan><tspan x="1054" dy="28">：fail-open</tspan><tspan x="1054" dy="28">即回到机械排序结果</tspan></text></g><g><rect x="1315" y="245" width="230" height="280" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><circle cx="1345" cy="277" r="20" fill="#339475"/><text x="1345" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">5</text><text x="1373" y="287" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">最终去重</text><text x="1339" y="323" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="450" fill="#45515a"><tspan x="1339" dy="0">Trace 与 Episode 若</tspan><tspan x="1339" dy="26">来自同一 episode，</tspan><tspan x="1339" dy="26">只保留更合适者</tspan><tspan x="1339" dy="26">收集关联 Policy 的 </tspan><tspan x="1339" dy="26">decision guidance</tspan><tspan x="1339" dy="26">形成 Packet</tspan></text></g><g><path d="M 355 385 L 390 385" fill="none" stroke="#4c88c5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="298.5" y="369" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="372.5" y="391" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#285f91">融合</text></g><g><path d="M 660 385 L 695 385" fill="none" stroke="#b98b25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/><rect x="603.5" y="369" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="677.5" y="391" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#80611b">survivors</text></g><g><path d="M 995 385 L 1030 385" fill="none" stroke="#8064bb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-purple)"/><rect x="938.5" y="369" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1012.5" y="391" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#624196">top-K</text></g><g><path d="M 1280 385 L 1315 385" fill="none" stroke="#d86554" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-coral)"/><rect x="1223.5" y="369" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1297.5" y="391" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9b3f31">kept</text></g><g><rect x="36" y="590" width="1528" height="1" fill="#66b79b" opacity="0.5"/><rect x="38" y="569" width="160" height="42" rx="21" fill="#339475"/><text x="118" y="597" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">InjectionPacket</text></g><g><rect x="55" y="635" width="350" height="290" rx="22" fill="#f5f6f7" stroke="#a8b0b6" stroke-width="2"/><text x="79" y="677" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#4e5961">结构化结果</text><text x="79" y="713" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">hits / snippets / rendered</tspan><tspan x="79" dy="28">retrievalId / reason / timing</tspan><tspan x="79" dy="28">每条保留 refKind、tier、score</tspan><tspan x="79" dy="28">candidate audit：候选→机械保留→</tspan><tspan x="79" dy="28">LLM 保留→最终返回</tspan><tspan x="79" dy="28">viewer 可复盘每个阶段</tspan></text></g><g><rect x="455" y="635" width="350" height="290" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><text x="479" y="677" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">分组渲染</text><text x="479" y="713" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="479" dy="0">Skills：简短摘要 + trigger</tspan><tspan x="479" dy="28">Memories：summary/reflection/va</tspan><tspan x="479" dy="28">lue</tspan><tspan x="479" dy="28">Experiences：procedure/verifica</tspan><tspan x="479" dy="28">tion/boundary</tspan><tspan x="479" dy="28">Environment：WorldModel body</tspan><tspan x="479" dy="28">Decision guidance：preference/a</tspan><tspan x="479" dy="28">nti-pattern</tspan></text></g><g><rect x="855" y="635" width="330" height="290" rx="22" fill="#fff0f1" stroke="#df7078" stroke-width="2"/><text x="879" y="677" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9e303b">安全边界</text><text x="879" y="713" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="879" dy="0">外层 &lt;relevant-memories&gt;</tspan><tspan x="879" dy="28">显式写明 UNTRUSTED DATA</tspan><tspan x="879" dy="28">历史文本不能覆盖当前指令</tspan><tspan x="879" dy="28">不把工具输出当系统提示</tspan><tspan x="879" dy="28">正文长度有预算与截断</tspan></text></g><g><rect x="1235" y="635" width="310" height="290" rx="22" fill="#eef8e9" stroke="#83b86b" stroke-width="2"/><text x="1259" y="677" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#40732e">交付确认</text><text x="1259" y="713" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1259" dy="0">core 返回 packet ≠ 一定已</tspan><tspan x="1259" dy="28">进模型</tspan><tspan x="1259" dy="28">适配器负责转换宿主 prompt </tspan><tspan x="1259" dy="28">形态</tspan><tspan x="1259" dy="28">调用日志分别记录候选、返回</tspan><tspan x="1259" dy="28">和接收</tspan><tspan x="1259" dy="28">因此页面不会把“召回”夸大成</tspan><tspan x="1259" dy="28">“模型使用”</tspan></text></g><g><path d="M 405 780 L 455 780" fill="none" stroke="#77838c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gray)"/><rect x="356" y="764" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="430" y="786" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#4e5961">render</text></g><g><path d="M 805 780 L 855 780" fill="none" stroke="#4c88c5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="756" y="764" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="830" y="786" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#285f91">wrap</text></g><g><path d="M 1185 780 L 1235 780" fill="none" stroke="#ca4c57" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/><rect x="1136" y="764" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="1210" y="786" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9e303b">adapter</text></g>
