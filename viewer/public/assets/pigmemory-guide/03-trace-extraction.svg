<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
    <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf9"/><stop offset="0.55" stop-color="#fff9f3"/><stop offset="1" stop-color="#eef8f4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5e4037" flood-opacity="0.10"/></filter>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d86554"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#339475"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4c88c5"/></marker><marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b98b25"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8064bb"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77838c"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ca4c57"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#619b49"/></marker>
  </defs>
    <rect width="1600" height="1100" fill="url(#bg)"/>
    <text x="58" y="70" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#d45f50">PIGMEMORY · 原理图 03/12</text><text x="58" y="126" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="900" fill="#3e3635">Trace 如何收集：把一轮对话拆成“决策点”</text><text x="60" y="166" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#786b67"><tspan x="60" dy="0">粒度不是整段聊天，也不是每条数据库消息；一次工具决策是一条 Trace，最终文字答复再单独一条。</tspan></text><line x1="58" y1="204" x2="1542" y2="204" stroke="#eadbd4" stroke-width="2"/>
    <g><rect x="55" y="250" width="350" height="330" rx="22" fill="#fff0eb" stroke="#e98b79" stroke-width="2"/><text x="79" y="292" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#9b3f31">原始 Episode 片段</text><text x="79" y="328" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">User：请检查并修复配置</tspan><tspan x="79" dy="28">Assistant meta：thinking…</tspan><tspan x="79" dy="28">Tool ① read_file(input)</tspan><tspan x="79" dy="28">Tool result ①：文件内容</tspan><tspan x="79" dy="28">Tool ② apply_patch(input)</tspan><tspan x="79" dy="28">Tool result ②：成功</tspan><tspan x="79" dy="28">Assistant：已修复，并说明验证结</tspan><tspan x="79" dy="28">果</tspan></text></g><g><rect x="485" y="250" width="300" height="330" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><circle cx="515" cy="282" r="20" fill="#b98b25"/><text x="515" y="289" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">1</text><text x="543" y="292" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">按 User 分段</text><text x="509" y="328" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="509" dy="0">遇到 user role 开新 segme</tspan><tspan x="509" dy="28">nt</tspan><tspan x="509" dy="28">合并该段的 user 文本</tspan><tspan x="509" dy="28">收集 assistant thinking/r</tspan><tspan x="509" dy="28">eflection</tspan><tspan x="509" dy="28">识别 tool role</tspan><tspan x="509" dy="28">若主机没写 tool role，则</tspan><tspan x="509" dy="28">从 assistant.meta.toolCal</tspan><tspan x="509" dy="28">ls 兜底</tspan></text></g><g><rect x="865" y="250" width="680" height="330" rx="22" fill="#edf5ff" stroke="#73a7d9" stroke-width="2"/><circle cx="895" cy="282" r="20" fill="#4c88c5"/><text x="895" y="289" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#fff">2</text><text x="923" y="292" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#285f91">一个回合拆成 3 个 StepCandidate</text><text x="889" y="328" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="889" dy="0">Step A / tool：userText=原问题；toolCalls=[read_file]；agentText=</tspan><tspan x="889" dy="28">空</tspan><tspan x="889" dy="28">Step B / tool：userText=空；toolCalls=[apply_patch]；agentText=空</tspan><tspan x="889" dy="28">Step C / response：userText=空；toolCalls=[]；agentText=最终答复</tspan><tspan x="889" dy="28">三个步骤共享 turnId（首个 user turn 的时间戳）</tspan><tspan x="889" dy="28">算法按步骤评分；查看器可按 turnId 折叠成“一轮一张卡”</tspan></text></g><g><path d="M 405 415 L 485 415" fill="none" stroke="#d86554" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-coral)"/><rect x="371" y="399" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="445" y="421" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#9b3f31">segment</text></g><g><path d="M 785 415 L 865 415" fill="none" stroke="#b98b25" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/><rect x="751" y="399" width="148" height="31" rx="15" fill="#fffdf9" opacity="0.94"/><text x="825" y="421" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#80611b">拆子步骤</text></g><g><rect x="36" y="640" width="1528" height="1" fill="#66b79b" opacity="0.5"/><rect x="38" y="619" width="160" height="42" rx="21" fill="#339475"/><text x="118" y="647" text-anchor="middle" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#fff">TraceRow 字段</text></g><g><rect x="55" y="690" width="355" height="280" rx="22" fill="#f5f6f7" stroke="#a8b0b6" stroke-width="2"/><text x="79" y="732" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#4e5961">身份与原文</text><text x="79" y="768" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="79" dy="0">id / episodeId / sessionId</tspan><tspan x="79" dy="28">ownerAgentKind / profile / work</tspan><tspan x="79" dy="28">space</tspan><tspan x="79" dy="28">ts / turnId</tspan><tspan x="79" dy="28">userText / agentText / agentThi</tspan><tspan x="79" dy="28">nking</tspan><tspan x="79" dy="28">toolCalls：name,input,output,er</tspan><tspan x="79" dy="28">rorCode, timing</tspan></text></g><g><rect x="455" y="690" width="355" height="280" rx="22" fill="#eaf8f3" stroke="#66b79b" stroke-width="2"/><text x="479" y="732" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#1c725a">派生检索字段</text><text x="479" y="768" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="479" dy="0">summary：LLM 摘要</tspan><tspan x="479" dy="28">tags：内容与工具标签</tspan><tspan x="479" dy="28">errorSignatures：结构化错误签名</tspan><tspan x="479" dy="28">vecSummary：摘要向量</tspan><tspan x="479" dy="28">vecAction：动作/工具向量</tspan><tspan x="479" dy="28">schemaVersion</tspan></text></g><g><rect x="855" y="690" width="330" height="280" rx="22" fill="#fff8df" stroke="#d8b45f" stroke-width="2"/><text x="879" y="732" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#80611b">评分字段</text><text x="879" y="768" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="879" dy="0">reflection：主题结束后补</tspan><tspan x="879" dy="28">alpha：反思可信度</tspan><tspan x="879" dy="28">rHuman：兼容字段/通常为空</tspan><tspan x="879" dy="28">value：回传后的 V_t</tspan><tspan x="879" dy="28">priority：max(V,0) × 时间衰减</tspan></text></g><g><rect x="1230" y="690" width="315" height="280" rx="22" fill="#f5efff" stroke="#9f83d5" stroke-width="2"/><text x="1254" y="732" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#624196">首次写入值</text><text x="1254" y="768" text-anchor="start" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="450" fill="#45515a"><tspan x="1254" dy="0">reflection = null</tspan><tspan x="1254" dy="28">alpha = 0</tspan><tspan x="1254" dy="28">value = 0</tspan><tspan x="1254" dy="28">priority = 0.5（冷启动可检</tspan><tspan x="1254" dy="28">索）</tspan><tspan x="1254" dy="28">主题结束后原位更新，不重复</tspan><tspan x="1254" dy="28">插入</tspan></text></g>
    <text x="1540" y="1070" text-anchor="end" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#9a8c87">依据当前源码执行链绘制 · 2026-08-07</text>
  </svg>